services:
  postgres:
    image: postgres:16-alpine
    container_name: webshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: webshop
      POSTGRES_USER: webshop
      POSTGRES_PASSWORD: webshop
    ports:
      - "5432:5432"
    volumes:
      - webshop-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  webshop-postgres-data:
