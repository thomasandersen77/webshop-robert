databaseChangeLog:
  - changeSet:
      id: 004-create-baskets
      author: robert
      changes:
        - createTable:
            tableName: baskets
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: customer_id
                  type: varchar(36)
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_baskets_customer
                    referencedTableName: users
                    referencedColumnNames: id
        - createTable:
            tableName: basket_items
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: basket_id
                  type: varchar(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_basket_items_basket
                    referencedTableName: baskets
                    referencedColumnNames: id
              - column:
                  name: product_id
                  type: varchar(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_basket_items_product
                    referencedTableName: products
                    referencedColumnNames: id
              - column:
                  name: quantity
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: unit_price_minor
                  type: bigint
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: basket_items
            columnNames: basket_id, product_id
            constraintName: uq_basket_item_product
