databaseChangeLog:
  - changeSet:
      id: 002-create-product-categories
      author: robert
      changes:
        - createTable:
            tableName: product_categories
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
