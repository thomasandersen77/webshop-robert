# Brukes av Failsafe (*IT) med Testcontainers @ServiceConnection — ikke sett jdbc-url mot localhost her.
spring:
  cloud:
    azure:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

jwt:
  secret: "test-jwt-secret-minimum-32-characters!!"
  expiration: 86400000
